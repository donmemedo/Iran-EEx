<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بدون اتصال | بهینه‌یار انرژی</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: system-ui, sans-serif; background: #fbfbfa; color: #0a1210;
        padding: 24px; text-align: center;
      }
      @media (prefers-color-scheme: dark) { body { background: #07090a; color: #e9efec; } }
      .card { max-width: 30rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; line-height: 2; opacity: 0.75; }
      button {
        font: inherit; padding: 0.75rem 1.5rem; border-radius: 0.75rem; border: 0;
        background: #00754e; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) { button { background: #00e5a0; color: #04120c; } }
      button:active { transform: scale(0.97); }
      svg { margin-bottom: 1.25rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true">
        <polygon points="26,4 6,28 18,28 16,44 36,20 24,20" fill="currentColor" opacity="0.35" />
      </svg>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>
        آخرین داده‌های دریافت‌شده در دستگاه شما ذخیره شده است. پس از برقراری اتصال، اعداد به‌روز می‌شوند.
      </p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
